name: Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
      # mcvm_gui is excluded: Tauri 1 links against webkit2gtk-4.0, which no
      # Ubuntu image newer than 22.04 ships, and wry 0.24 does not build
      # against it on current toolchains. A separate job can cover the GUI.
      - name: Run tests
        run: cargo test --workspace --exclude mcvm_gui --verbose
